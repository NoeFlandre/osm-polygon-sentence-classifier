[project]
name = "osm-polygon-sentence-classifier"
version = "0.1.1"
description = "Reproducible sentence classifiers for OSM polygon descriptions."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "NoeFlandre" },
]
keywords = [
    "openstreetmap",
    "wikidata",
    "sentence-classification",
    "landuse",
    "place-relevance",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/NoeFlandre/osm-polygon-sentence-classifier"
Repository = "https://github.com/NoeFlandre/osm-polygon-sentence-classifier"
Issues = "https://github.com/NoeFlandre/osm-polygon-sentence-classifier/issues"
Documentation = "https://noeflandre.github.io/osm-polygon-sentence-classifier/"

[project.scripts]
audit-landuse-dataset = "osm_polygon_sentence_classifier.audit_cli:main"
grid5000-landuse = "osm_polygon_sentence_classifier.grid5000_cli:main"
grid5000-place-relevance-v2 = "osm_polygon_sentence_classifier.grid5000_place_relevance_cli:main"

[project.optional-dependencies]
training = [
    "accelerate>=1,<2",
    "datasets>=4,<5",
    "huggingface-hub>=1.10,<2",
    "trackio>=0.26,<1",
    "torch>=2.6,<3",
    "transformers>=5,<6",
]
docs = [
    "mkdocs-material>=9.6,<10",
]

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "mutmut>=3.7,<4",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "ruff>=0.14,<0.15",
    "radon>=6,<7",
    "ty>=0.0.65,<0.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osm_polygon_sentence_classifier = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "C901",
    "SIM",
    "PT",
    "RUF100",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["osm_polygon_sentence_classifier"]

[tool.ty.src]
include = ["src", "tests"]

[tool.mutmut]
source_paths = ["src/osm_polygon_sentence_classifier"]
# These patterns cover runtime-equivalent mutations only: typing casts have no
# runtime semantics, JSON treats the falsey None forms like False, Python
# treats UTF-8 codec names case-insensitively, and positive policy durations
# make equality at a window boundary observationally equivalent here.
# The checkpoint publication handle is initialized only to satisfy the local
# annotation and is unconditionally replaced before any read.
do_not_mutate_patterns = [
    "\\bcast\\(",
    "ensure_ascii=False",
    "allow_nan=False",
    '.encode("utf-8")',
    '.encode("UTF-8")',
    'getattr(run_state, "facts", {})',
    'facts.get("completion", {})',
    'record.get("metrics", {})',
    'add_argument\(\s*"--checkout-commit",\s*default=None',
    'if local < day_start:',
    'if local < day_end:',
    'checkpoint_hub_api = None',
]
also_copy = [
    ".dockerignore",
    ".github/",
    ".gitignore",
    ".pre-commit-config.yaml",
    "CITATION.cff",
    "CONTRIBUTING.md",
    "Dockerfile",
    "README.md",
    "docs/",
    "justfile",
    "mkdocs.yml",
]
