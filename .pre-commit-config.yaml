repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: Ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-lint
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q tests/unit tests/contract
        language: system
        pass_filenames: false
